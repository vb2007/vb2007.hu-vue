# Reason phrases for the plain-text error bodies below.
map $status $plain_error_reason {
    400     "Bad Request";
    403     "Forbidden";
    404     "Not Found";
    405     "Method Not Allowed";
    408     "Request Timeout";
    413     "Content Too Large";
    414     "URI Too Long";
    494     "Request Header Too Large";
    500     "Internal Server Error";
    502     "Bad Gateway";
    503     "Service Unavailable";
    504     "Gateway Timeout";
    default "Error";
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    # Directory redirects (/assets -> /assets/) stay relative: behind the tunnel an
    # absolute Location would carry the container's http scheme and port 8080.
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # Locations with their own add_header include this again.
    include /etc/nginx/snippets/security-headers.conf;

    # Errors nginx answers itself (missing assets, the robots.txt 403, bad requests) get a
    # short plain-text body instead of its stock HTML page. Without "=" the status is kept.
    # A URI, not a named location: those fail with a 500 when the request line is bad.
    error_page 400 403 404 405 408 413 414 494 500 502 503 504 /_plain-error;

    location = /_plain-error {
        internal;
        default_type text/plain;
        # The response still goes out with the original error status, not this 200.
        return 200 "$status $plain_error_reason\n";
    }

    # Container healthcheck target.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Matrix delegation, carried over from the old PHP vhost: @user:vb2007.hu lives on matrix.vb2007.hu.
    location = /.well-known/matrix/client {
        return 301 https://matrix.vb2007.hu$request_uri;

        # CORS headers to allow clients to fetch this from any origin
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Origin, X-Requested-With, Content-Type, Accept' always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = /.well-known/matrix/server {
        default_type application/json;
        return 200 '{"m.server": "matrix.vb2007.hu:443"}';
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Old rule: crawlers get an empty (allow-all) robots.txt, everyone else 403.
    location = /robots.txt {
        default_type text/plain;
        if ($http_user_agent ~* (bot|crawl|spider)) {
            return 200;
        }
        return 403;
    }

    # Vite fingerprints everything under /assets, so it is safe to cache forever.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # The entry point must always be revalidated so new deploys are picked up.
    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # vue-router uses history mode: unknown paths fall back to the SPA.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }
}
