name: vb2007-hu

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  frontend:
    build:
      context: .
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://api.vb2007.hu}
    # Deploys pull this exact tag from GHCR (IMAGE_TAG is set by the release workflow);
    # `docker compose up -d --build` still builds it from source locally.
    image: ghcr.io/vb2007/vb2007.hu-vue:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # No published ports: the app is only reachable by cloudflared over the compose network.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  cloudflared:
    image: cloudflare/cloudflared:2026.10.0
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?Set TUNNEL_TOKEN in .env (see README, Deployment)}
    depends_on:
      frontend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
