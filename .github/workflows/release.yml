name: Release & Deploy

# Runs on every push to main (a merged, already-CI-tested PR) and on demand.
# Builds the image and pushes it to GHCR, cuts a GitHub release with a new
# version, then deploys that exact image to the self-hosted host (vbServer),
# where the runner lives next to the compose stack in DEPLOY_DIR.
#
# Version rule (.github/scripts/next-version.mjs): the package.json version if
# it is newer than the latest v* tag (bump it in a PR for a minor/major),
# otherwise a patch bump of the latest tag. A re-run on an already-tagged
# commit makes no new release and just redeploys.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Deploys queue instead of cancelling each other, so a half-finished
# `docker compose up` is never interrupted.
concurrency:
  group: release-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/vb2007/vb2007.hu-vue
  DEPLOY_DIR: /mnt/raid1/vb2007.hu

jobs:
  # ---------------------------------------------------------------------------
  # Decides the version and whether this push is a new release.
  # ---------------------------------------------------------------------------
  version:
    name: Determine version
    runs-on: [self-hosted, Linux, X64]
    outputs:
      version: ${{ steps.next.outputs.version }}
      is_release: ${{ steps.next.outputs.is_release }}
      short_sha: ${{ steps.next.outputs.short_sha }}
    steps:
      # Full history: the script needs every v* tag.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Work out the version
        id: next
        run: node .github/scripts/next-version.mjs

  # ---------------------------------------------------------------------------
  # Builds the image. sha-<short_sha> and latest are always pushed; the bare
  # <version> tag only for a new release, so an existing release's tag is never
  # moved by a re-run.
  # ---------------------------------------------------------------------------
  build-push:
    name: Build & push image
    needs: [version]
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build tag list
        id: tags
        env:
          VERSION: ${{ needs.version.outputs.version }}
          SHORT_SHA: ${{ needs.version.outputs.short_sha }}
          IS_RELEASE: ${{ needs.version.outputs.is_release }}
        run: |
          {
            echo "tags<<TAGS"
            echo "${IMAGE}:sha-${SHORT_SHA}"
            echo "${IMAGE}:latest"
            if [ "$IS_RELEASE" = "true" ]; then
              echo "${IMAGE}:${VERSION}"
            fi
            echo "TAGS"
          } >> "$GITHUB_OUTPUT"

      # VITE_API_BASE_URL is compiled into the bundle; set the repo variable of
      # the same name to point the build at a different API.
      - name: Build & push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL || 'https://api.vb2007.hu' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Only for a new version: tags v<version> and cuts the GitHub release, with
  # auto-generated notes, a digest table, the merged PR's test summary (best
  # effort) and a few assets: a compose file pinned to this version, the image
  # digest manifest, and the built site as a tarball.
  # ---------------------------------------------------------------------------
  release:
    name: Cut release
    needs: [version, build-push]
    if: needs.version.outputs.is_release == 'true'
    runs-on: [self-hosted, Linux, X64]
    # A job-level block replaces the workflow-level one: packages: read to pull
    # the image for its dist/, actions + pull-requests: read for the CI reports.
    permissions:
      contents: write
      packages: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare release assets
        env:
          VERSION: ${{ needs.version.outputs.version }}
          SHORT_SHA: ${{ needs.version.outputs.short_sha }}
          DIGEST: ${{ needs.build-push.outputs.digest }}
        run: |
          mkdir -p release-assets

          # compose.yaml defaulting to this exact version, so downloading just
          # this asset (with a .env holding TUNNEL_TOKEN) reproduces the release.
          sed "s/\${IMAGE_TAG:-latest}/\${IMAGE_TAG:-${VERSION}}/g" \
            compose.yaml > release-assets/compose.yaml

          cat > release-assets/images.json <<JSON
          {
            "version": "${VERSION}",
            "frontend": { "image": "${IMAGE}", "tag": "${VERSION}", "digest": "${DIGEST}" }
          }
          JSON

          # The site tarball comes out of the image that was just pushed, so it
          # is the byte-identical shipped build. The runner is persistent, so a
          # leftover container from a failed run may still exist.
          docker pull "${IMAGE}:sha-${SHORT_SHA}"
          docker rm -f dist-extract > /dev/null 2>&1 || true
          docker create --name dist-extract "${IMAGE}:sha-${SHORT_SHA}"
          docker cp dist-extract:/usr/share/nginx/html ./site-dist
          docker rm -f dist-extract
          tar -czf "release-assets/site-dist-${VERSION}.tar.gz" -C site-dist .
          rm -rf site-dist

      # Best effort: never blocks a release (e.g. a manual run has no merged PR).
      - name: Fetch test reports from the merged PR's CI run
        id: reports
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require("fs");

            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha
            });
            const merged = prs.find((p) => p.merged_at);
            if (!merged) throw new Error("No merged PR found for this commit");

            const { data: runs } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "ci.yml",
              head_sha: merged.head.sha,
              status: "completed"
            });
            if (runs.workflow_runs.length === 0) throw new Error("No completed CI run found for the PR head commit");

            const { data: artifacts } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runs.workflow_runs[0].id
            });
            // ci.yml publishes report.html/.ods and summary.md/.json as separate,
            // run-number-suffixed artifacts rather than one bundle.
            const reportArtifacts = artifacts.artifacts.filter(
              (a) => a.name.startsWith("report-") || a.name.startsWith("summary-")
            );
            if (reportArtifacts.length === 0) throw new Error("No report/summary artifacts on that run");

            fs.mkdirSync("release-assets/test-reports", { recursive: true });
            for (const artifact of reportArtifacts) {
              const download = await github.rest.actions.downloadArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
                archive_format: "zip"
              });
              // download.data isn't reliable across Octokit versions, but the
              // signed download.url is; archive: false uploads come back as the
              // raw file, so the bytes are written out as-is, with no unzip.
              const res = await fetch(download.url);
              if (!res.ok) throw new Error(`Failed to download artifact ${artifact.name}: ${res.status} ${res.statusText}`);
              fs.writeFileSync(`release-assets/test-reports/${artifact.name}`, Buffer.from(await res.arrayBuffer()));
            }

            const summaryFile = reportArtifacts.find((a) => a.name.startsWith("summary-") && a.name.endsWith(".md"));
            if (!summaryFile) throw new Error("summary.md artifact not found among the CI run's report artifacts");
            core.setOutput("found", "true");
            core.setOutput("summary", fs.readFileSync(`release-assets/test-reports/${summaryFile.name}`, "utf-8"));

      # Dynamic values go through env: and are read as shell variables, never
      # interpolated into the script (the summary contains test names).
      - name: Compose release body
        id: body
        env:
          VERSION: ${{ needs.version.outputs.version }}
          DIGEST: ${{ needs.build-push.outputs.digest }}
          REPORTS_FOUND: ${{ steps.reports.outputs.found }}
          SUMMARY_MD: ${{ steps.reports.outputs.summary }}
        run: |
          {
            echo "body<<RELEASE_BODY_EOF_4d7e1b"
            echo "## vb2007.hu v${VERSION}"
            echo ""
            echo "**Image**"
            echo ""
            echo "| Image | Digest |"
            echo "|---|---|"
            echo "| \`${IMAGE}:${VERSION}\` | \`${DIGEST}\` |"
            echo ""
            if [ "$REPORTS_FOUND" = "true" ]; then
              echo "**Test results (from the merged PR's CI run)**"
              echo ""
              echo "$SUMMARY_MD"
            else
              echo "_Test results were not available for this release (no matching CI run found)._"
            fi
            echo "RELEASE_BODY_EOF_4d7e1b"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ needs.version.outputs.version }}
          body: ${{ steps.body.outputs.body }}
          generate_release_notes: true
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          files: release-assets/**

  # ---------------------------------------------------------------------------
  # Pulls the exact sha-pinned image and restarts the stack in DEPLOY_DIR. Only
  # compose.yaml is synced there: .env (TUNNEL_TOKEN) is owned by the host and
  # never touched. Runs only after the release exists (or was not needed).
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy
    needs: [version, build-push, release]
    if: always() && needs.build-push.result == 'success' && (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: read
      packages: read
    env:
      IMAGE_TAG: sha-${{ needs.version.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the deploy directory is set up
        run: |
          if ! grep -qs '^TUNNEL_TOKEN=.\+' "${DEPLOY_DIR}/.env"; then
            echo "::error::${DEPLOY_DIR}/.env is missing or has no TUNNEL_TOKEN. One-time host setup: mkdir ${DEPLOY_DIR}, then put TUNNEL_TOKEN=<token> in ${DEPLOY_DIR}/.env (see README, Deployment)."
            exit 1
          fi

      - name: Sync compose file to the deploy directory
        run: cp compose.yaml "${DEPLOY_DIR}/compose.yaml"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image
        working-directory: ${{ env.DEPLOY_DIR }}
        run: docker compose pull frontend

      # --wait blocks until the services are running/healthy and fails
      # otherwise; --no-build guarantees only the pulled image is ever deployed.
      - name: Restart stack
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          docker compose up -d --no-build --remove-orphans --wait --wait-timeout 120 || {
            docker compose ps
            docker compose logs --tail=100
            exit 1
          }

      - name: Smoke test the public site
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "::notice::Repository variable SITE_URL is not set, skipping the public smoke test."
            exit 0
          fi
          curl -fsS --retry 10 --retry-delay 3 --retry-all-errors "${SITE_URL%/}/healthz"

      # Dangling images only: tagged images (e.g. the one just deployed) stay.
      - name: Prune old images
        if: always()
        run: docker image prune -f --filter "until=168h"
