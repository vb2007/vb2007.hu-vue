name: Open Dev to Main PR

# Manual only: "Run workflow" on the Actions tab. Opens the dev -> main PR as
# "Merge dev To main", assigned to the owner, listing the PRs merged into dev
# that main doesn't have yet and the issues each one resolves
# (.github/scripts/dev-to-main-body.mjs). The issues close when the PR is
# merged, because main is the default branch.
#
# A PR opened with the default GITHUB_TOKEN doesn't trigger other workflows, so
# PR Tests wouldn't run on it. Add a PR_TOKEN secret (a PAT with pull-requests
# write) to get the checks; without it the workflow falls back to GITHUB_TOKEN.
# Either way the repo setting "Allow GitHub Actions to create and approve pull
# requests" must be on.
on:
  workflow_dispatch:

concurrency:
  group: dev-to-main-pr
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

env:
  NODE_VERSION: "22"
  ASSIGNEE: vb2007

jobs:
  open-pr:
    name: Open PR
    runs-on: [self-hosted, Linux, X64]
    env:
      GH_TOKEN: ${{ secrets.PR_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      # Full history: the script compares origin/main with origin/dev.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Stop if a dev -> main PR is already open
        run: |
          existing=$(gh pr list --base main --head dev --state open --json url --jq '.[0].url')
          if [ -n "$existing" ]; then
            echo "::error::A dev -> main PR is already open: $existing"
            exit 1
          fi

      - name: Build the PR description
        id: body
        run: node .github/scripts/dev-to-main-body.mjs "$RUNNER_TEMP/pr-body.md"

      - name: Open the PR
        if: steps.body.outputs.count != '0'
        run: |
          gh pr create --base main --head dev \
            --title "Merge dev To main" \
            --body-file "${{ steps.body.outputs.body_file }}" \
            --assignee "$ASSIGNEE"

      - name: Nothing to merge
        if: steps.body.outputs.count == '0'
        run: echo "::notice::main already has every PR merged into dev, so no PR was opened."
