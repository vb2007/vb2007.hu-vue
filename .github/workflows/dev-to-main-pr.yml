name: Open Dev to Main PR

# Manual only: "Run workflow" on the Actions tab. Opens the dev -> main PR as
# "Merge dev To main", assigned to the owner, listing the PRs merged into dev
# that main doesn't have yet and the issues each one resolves
# (.github/scripts/dev-to-main-body.mjs). The issues close when the PR is
# merged, because main is the default branch.
#
# A PR opened with the default GITHUB_TOKEN doesn't trigger other workflows, so
# PR Tests wouldn't run on it. Add a PR_TOKEN secret (a fine-grained PAT for
# this repo with Pull requests: read/write and Contents: read) to get the
# checks. Without it the workflow falls back to GITHUB_TOKEN, and the repo
# setting "Allow GitHub Actions to create and approve pull requests" must be on.
on:
  workflow_dispatch:

concurrency:
  group: dev-to-main-pr
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

env:
  NODE_VERSION: "22"
  ASSIGNEE: vb2007

jobs:
  open-pr:
    name: Open PR
    runs-on: [self-hosted, Linux, X64]
    env:
      GH_TOKEN: ${{ secrets.PR_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      # Full history: the script compares origin/main with origin/dev.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Stop if a dev -> main PR is already open
        run: |
          existing=$(gh pr list --base main --head dev --state open --json url --jq '.[0].url')
          if [ -n "$existing" ]; then
            echo "::error::A dev -> main PR is already open: $existing"
            exit 1
          fi

      - name: Build the PR description
        id: body
        run: node .github/scripts/dev-to-main-body.mjs "$RUNNER_TEMP/pr-body.md"

      - name: Open the PR
        if: steps.body.outputs.count != '0'
        env:
          HAS_PR_TOKEN: ${{ secrets.PR_TOKEN != '' }}
        run: |
          if [ "$HAS_PR_TOKEN" != "true" ]; then
            echo "::warning::PR_TOKEN is not set, so GITHUB_TOKEN opens the PR and PR Tests won't run on it."
          fi
          status=0
          output=$(gh pr create --base main --head dev \
            --title "Merge dev To main" \
            --body-file "${{ steps.body.outputs.body_file }}" \
            --assignee "$ASSIGNEE" 2>&1) || status=$?
          echo "$output"
          if [ "$status" -ne 0 ] && grep -q "not permitted to create or approve pull requests" <<< "$output"; then
            echo '::error::GitHub Actions is not allowed to open PRs here. Add a PR_TOKEN secret (a fine-grained PAT for this repo with Pull requests: read/write and Contents: read), or turn on Settings → Actions → General → "Allow GitHub Actions to create and approve pull requests". Only PR_TOKEN makes PR Tests run.'
          fi
          exit "$status"

      - name: Nothing to merge
        if: steps.body.outputs.count == '0'
        run: echo "::notice::main already has every PR merged into dev, so no PR was opened."
